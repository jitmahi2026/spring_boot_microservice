eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*
management.info.env.enabled=true

management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

resilience4j.retry.instances.productService.max-attempts=3

resilience4j.retry.instances.productService.wait-duration=2s

resilience4j.ratelimiter.instances.productService.limit-for-period=5

resilience4j.ratelimiter.instances.productService.limit-refresh-period=10s

resilience4j.ratelimiter.instances.productService.timeout-duration=0

resilience4j.bulkhead.instances.productService.max-concurrent-calls=10

resilience4j.bulkhead.instances.productService.max-wait-duration=1s